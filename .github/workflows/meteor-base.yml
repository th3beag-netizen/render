name: Beegi 26.3 — Meteor source foundation
on:
  push:
    branches: [beegi-meteor-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned upstream Meteor 26.3 source
        run: |
          git clone https://github.com/MeteorDevelopment/meteor-client.git meteor-upstream
          git -C meteor-upstream checkout --detach ec8cdb088af88582bade7cd3b0dfbe71ccd2285c
          test -f meteor-upstream/LICENSE
          grep -q 'minecraft = "26.3"' meteor-upstream/gradle/libs.versions.toml
      - name: Apply Beegi source patch
        run: |
          python3 patch_meteor.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("meteor-upstream/src/main/resources/fabric.mod.json").read_text())
          assert m["name"] == "Beegi (Meteor-based)"
          assert m["id"] == "meteor-client"
          assert m["license"] == "GPL-3.0"
          print("Identity and license checks passed")
          PY
      - name: Apply Peegi-style GUI, menu controls and HUD
        run: |
          base64 --decode peegi-ui.patch.xz.b64 > /tmp/peegi-ui.patch.xz
          echo 'c9a3177a3f4222473ab2d9285382666ff31a105d44b3b58cb807ed4c12d628d0  /tmp/peegi-ui.patch.xz' | sha256sum --check
          xz -dc /tmp/peegi-ui.patch.xz > /tmp/peegi-ui.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/peegi-ui.patch)
          mkdir -p meteor-upstream/src/main/resources/assets/meteor-client/textures/gui
          base64 --decode peegi-hud-logo.png.b64 > meteor-upstream/src/main/resources/assets/meteor-client/textures/gui/beegi_peegi_logo.png
          echo '492357888acf952643e512df2cadc679ce59f0be7e0be21e56fb103a3d4e2af2  meteor-upstream/src/main/resources/assets/meteor-client/textures/gui/beegi_peegi_logo.png' | sha256sum --check
          grep -q 'register(PeegiLogoHud.INFO)' meteor-upstream/src/main/java/meteordevelopment/meteorclient/systems/hud/Hud.java
          grep -q 'add(new MeteorGuiTheme("Peegi"))' meteor-upstream/src/main/java/meteordevelopment/meteorclient/gui/GuiThemes.java
      - name: Apply Peegi v2 visual overhaul
        run: |
          base64 --decode beegi-ui-v2.patch.xz.b64 > /tmp/beegi-ui-v2.patch.xz
          echo 'da5460add3eec197e887e8ac23d926cde713ca6194d2286b2a5e225120ab5478  /tmp/beegi-ui-v2.patch.xz' | sha256sum --check
          xz -dc /tmp/beegi-ui-v2.patch.xz > /tmp/beegi-ui-v2.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/beegi-ui-v2.patch)
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/gui/themes/meteor/PeegiDraw.java
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/systems/hud/elements/PeegiTextHud.java
      - name: Apply Beegi V3 Peegi home, dashboard, presets and HUD
        run: |
          base64 --decode peegi-v3.patch.xz.b64 > /tmp/peegi-v3.patch.xz
          echo '54851525e59dbd97220d36bc20053b4649771999ef6be29652a74a616cb05758  /tmp/peegi-v3.patch.xz' | sha256sum --check
          xz -dc /tmp/peegi-v3.patch.xz > /tmp/peegi-v3.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/peegi-v3.patch)
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/gui/screens/PeegiHomeScreen.java
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/systems/hud/elements/PeegiArrayHud.java
      - name: Apply Beegi V4 layout and small-resolution fixes
        run: |
          base64 --decode peegi-v4.patch.xz.b64 > /tmp/peegi-v4.patch.xz
          echo '4348a9d2a839050c445945e0efc92d036759e0eaafc65142a3ffcc6b7dab41c3  /tmp/peegi-v4.patch.xz' | sha256sum --check
          xz -dc /tmp/peegi-v4.patch.xz > /tmp/peegi-v4.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/peegi-v4.patch)
      - name: Apply Peegi V5 Studio and local module snapshots
        run: |
          base64 --decode peegi-v5-studio.patch.xz.b64 > /tmp/peegi-v5-studio.patch.xz
          echo 'c18d950ab29084e4e3c34ee602444a8483cb55cb5fe43fef2ea547e2fe533205  /tmp/peegi-v5-studio.patch.xz' | sha256sum --check
          xz -dc /tmp/peegi-v5-studio.patch.xz > /tmp/peegi-v5-studio.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/peegi-v5-studio.patch)
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/gui/screens/PeegiStudioScreen.java
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/gui/screens/PeegiSnapshots.java
      - name: Apply Beegi V6 full profiles, combo display and Studio shortcuts
        run: |
          base64 --decode peegi-v6.patch.xz.b64 > /tmp/peegi-v6.patch.xz
          echo 'a315524d6ff5bed9f0240ae455d318c4ca27562377dd2483e368798bf7db257b  /tmp/peegi-v6.patch.xz' | sha256sum --check
          xz -dc /tmp/peegi-v6.patch.xz > /tmp/peegi-v6.patch
          (cd meteor-upstream && patch --batch --forward -p1 < /tmp/peegi-v6.patch)
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/systems/modules/combat/PeegiComboTracker.java
          test -f meteor-upstream/src/main/java/meteordevelopment/meteorclient/systems/hud/elements/PeegiComboHud.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Meteor-derived Beegi on Minecraft 26.3
        working-directory: meteor-upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace
      - name: Upload Beegi mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beegi-meteor-26.3-jars
          path: meteor-upstream/build/libs/*.jar
          if-no-files-found: error
      - name: Package corresponding GPL source
        if: success()
        run: |
          tar -czf beegi-meteor-26.3-complete-source.tar.gz --exclude=.git -C meteor-upstream .
      - name: Upload full modified source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beegi-meteor-26.3-source-gpl
          path: beegi-meteor-26.3-complete-source.tar.gz
          if-no-files-found: error
